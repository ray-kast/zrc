if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set-option -g default-terminal "tmux-256color"' \
  'set-option -g default-terminal "screen-256color"'
set -g mode-keys vi

bind-key -T copy-mode-vi i send-keys -X cancel

bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix l select-pane -R
bind-key -T prefix C-h select-pane -L
bind-key -T prefix C-j select-pane -D
bind-key -T prefix C-k select-pane -U
bind-key -T prefix C-l select-pane -R

set-option -g mouse on
set-option -g escape-time 10
set-option -g focus-events on
set-option -g history-limit 10000
set-option -g set-titles on
set-option -g set-titles-string '#{pane_title} (#W)'

set-option -sa terminal-features ',xterm-kitty:RGB:bpaste:hyperlinks:osc7:overline:usstyle'
set-option -sa terminal-features ',xterm-ghostty:bpaste:osc7:cstyle:ccolour:hyperlinks:overline:usstyle:progressbar'
set-option -sa terminal-features ',alacritty:RGB:bpaste'
set-option -sa terminal-features ',xterm*:RGB:bpaste:focus:cstyle'
set-option -sa terminal-features ',tmux*:RGB:bpaste:focus:cstyle'
set-option -sa terminal-features ',screen*:cstyle'
set-option -sa terminal-features ',st*:cstyle'
